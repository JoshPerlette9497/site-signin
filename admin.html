<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Site Sign-In</title>
<meta http-equiv="refresh" content="0; url=./index.html">
</head>
<body>
<script>
  // Admin is now the "Admin" tab inside the main app rather than its own
  // page/installed icon — clean up the old standalone-admin service worker
  // and cache so nothing stale lingers, then redirect.
  if('serviceWorker' in navigator){
    navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(r => r.unregister()));
  }
  if('caches' in window){
    caches.keys().then(keys => keys.forEach(k => { if(k.startsWith('sitesigninadmin-')) caches.delete(k); }));
  }
  location.replace('./index.html');
</script>
<p>Admin is now a tab inside the main app — redirecting… <a href="./index.html">Continue</a></p>
</body>
</html>
