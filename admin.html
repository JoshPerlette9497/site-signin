<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Site Sign-In</title>
<meta http-equiv="refresh" content="0; url=./index.html">
<style>
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:#1F5C60; color:#fff; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    text-align:center; padding:24px; box-sizing:border-box;
  }
  a{color:#73BDBE;}
</style>
</head>
<body>
<script>
  // Admin is now the "Admin" tab inside the main app rather than its own
  // page/installed icon — clean up the old standalone-admin service worker
  // and cache so nothing stale lingers, then redirect.
  if('serviceWorker' in navigator){
    navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(r => r.unregister()));
  }
  if('caches' in window){
    caches.keys().then(keys => keys.forEach(k => caches.delete(k)));
  }
  location.replace('./index.html');
</script>
<p>Admin is now a tab inside the main Site Sign-In app.<br>Taking you there — if nothing happens, <a href="./index.html">tap here</a>, then delete this old "Admin" icon from your home screen and use "Site Sign-In" instead.</p>
</body>
</html>
