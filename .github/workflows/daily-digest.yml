name: Daily activity digest

on:
  schedule:
    # 22:00 UTC = 6:00 PM Eastern Daylight Time (5:00 PM EST in winter).
    # Cron is always UTC — adjust the hour here if you want a different
    # local send time, or if the EST/EDT offset matters to you.
    - cron: '0 22 * * *'
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab, to test

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Send digest
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_TO_EMAIL: ${{ secrets.DIGEST_TO_EMAIL }}
          DIGEST_FROM_EMAIL: ${{ vars.DIGEST_FROM_EMAIL }}
        run: node scripts/daily-digest.js
