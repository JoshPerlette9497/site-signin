name: Daily activity digest

# The scheduled cron trigger is disabled — activity emails now fire in
# real time, per event, straight from Supabase (see
# supabase/realtime-email-trigger.sql) rather than once a day here. This
# workflow is kept around only for workflow_dispatch, in case you ever
# want to manually pull a same-day rollup on demand from the Actions tab.
on:
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab, to test

jobs:
  send-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Send digest
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_TO_EMAIL: ${{ secrets.DIGEST_TO_EMAIL }}
          DIGEST_FROM_EMAIL: ${{ vars.DIGEST_FROM_EMAIL }}
        run: node scripts/daily-digest.js
